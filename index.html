<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <span id="logo" class="bold"> agoodshop </span>
        <div id="header-separator"></div>
    </header>
    
    <div id = "content-shop">
        <div id = "content-products">
            <div id="grid-products">
                <div class="grid-producst-head">Producto</div>
                <div class="grid-producst-head">Cantidad</div>
                <div class="grid-producst-head">Unidad</div>
                <div class="grid-producst-head">Total</div>
                <div id="grid-head-separator"> </div>
            </div>
        </div>
        
        <div id="content-total">
            <h1 id="total-tittle" class="bold">Total</h1>
            <div id="content-total-products"></div>
            <div id="total-separator"> </div>
            <div class="total-products">
                <span>TOTAL</span>
                <div id="precio-total" class="bold">0€</div>
            </div>
        </div>
    </div>
    <!-- type="module" para cersiorarse de que se ejecuta el javascript después que el DOM-->
    <script type="module" src="main.js"></script>
</body>
</html>
